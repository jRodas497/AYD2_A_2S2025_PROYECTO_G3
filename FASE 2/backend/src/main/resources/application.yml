server:
  # Render asigna el puerto por variable de entorno; en local y en docker-compose no se define,
  # así que cae en 8080 de siempre.
  port: ${PORT:8080}
  error:
    # Sin esto, un 404/400 normal no trae "message" y solo el 409 de sin-stock lo tenía
    # (por un manejador propio). Frontend necesita el mismo formato en todos los errores.
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: sgologic-backend
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      group-id: sgologic
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgologic}
    username: ${DB_APP_USER:sgologic_app}
    password: ${DB_APP_PASSWORD:sgologic_app_dev}
  task:
    scheduling:
      pool:
        # Varios jobs corren en paralelo (reservas, outbox, avisos, POS, ERP). Con un solo hilo,
        # un envío lento a un tercero dejaría a los demás esperando su turno.
        size: 5
  jpa:
    open-in-view: false
    hibernate:
      # La base ya existe (migraciones en FASE 2/db). Hibernate nunca crea ni cambia tablas.
      ddl-auto: none
    properties:
      hibernate:
        default_schema: orders
        format_sql: false

sgologic:
  auth:
    # Solo dev: en cualquier despliegue real este secreto va en una variable de entorno propia,
    # no en el archivo. Firma el JWT que emite POST /api/auth/login.
    jwt-secret: ${JWT_SECRET:sgologic-dev-secret-cambiar-en-produccion-0123456789}
    jwt-expiration-minutes: 480

  reservation:
    # Cada cuánto corre el job que libera reservas vencidas (ms). El TTL en sí vive en config.setting.
    release-expired-fixed-delay-ms: 30000

  # --- Backend 2: transacciones e integraciones ---

  outbox:
    # Recovery relay DB -> Kafka only; business retries belong to Kafka retry topics.
    poll-fixed-delay-ms: 2000

  circuit:
    # Fallas seguidas antes de abrir el circuito de un tercero, y cuánto se queda abierto.
    failure-threshold: 3
    open-seconds: 20

  erp:
    # El intervalo real (30 min) vive en config.setting; esto es cada cuánto se revisa si ya toca.
    check-fixed-delay-ms: 60000
    format: CSV
    output-dir: /app/erp-out

  invoicing:
    series: A
    issuer-name: MegaStore, S.A.
    issuer-tax-id: 1234567-8

  providers:
    payklik: ${PAYKLIK_URL:http://payklik:8090}
    sat: ${SAT_URL:http://sat:8090}
    logiexpress: ${LOGIEXPRESS_URL:http://logiexpress:8090}
    messaging: ${MESSAGING_URL:http://messaging:8090}
    pos: ${POS_URL:http://pos:8090}
    erp: ${ERP_URL:http://erp:8090}
