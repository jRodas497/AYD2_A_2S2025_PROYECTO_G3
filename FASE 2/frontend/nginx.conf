server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API se reenvía al backend del compose, igual que el proxy de Vite en desarrollo.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas del cliente (React Router): cualquier ruta que no sea un archivo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
