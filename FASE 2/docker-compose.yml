services:
  db:
    image: postgres:16-alpine
    container_name: sgologic-db
    environment:
      POSTGRES_DB: sgologic
      POSTGRES_USER: sgologic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgologic_dev}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgologic -d sgologic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
