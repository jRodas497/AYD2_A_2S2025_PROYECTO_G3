<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrito</title>
<link rel="stylesheet" href="estilo-mockups.css">
</head>
<body>
  <div class="volver"><a href="index.html">&larr; Índice</a></div>
  <div class="frame">
    <div class="topbar">
      <span><strong>MegaStore</strong></span>
      <span class="sub">Ana P.</span>
    </div>
    <div class="tabs">
      <div class="tab">Tienda física</div>
      <div class="tab active">Web</div>
      <div class="tab">App móvil</div>
      <div class="tab">Centro de atención</div>
    </div>
    <div class="content">
      <h2>Carrito</h2>
      <div class="item">
        <div class="thumb"></div>
        <div class="name">Refrigeradora 14 pies³<small>LB-1440</small></div>
        <div class="qty">1</div>
        <div class="price">Q 4,999.00</div>
      </div>
      <div class="item">
        <div class="thumb"></div>
        <div class="name">Camisa manga larga · M<small>RP-0221</small></div>
        <div class="qty">2</div>
        <div class="price">Q 258.00</div>
      </div>
      <div class="item">
        <div class="thumb"></div>
        <div class="name">Audífonos inalámbricos<small>EL-0907</small></div>
        <div class="qty">1</div>
        <div class="price">Q 349.00</div>
      </div>

      <div class="summary total"><span>Total</span><span>Q 5,606.00</span></div>
      <p class="pie-dato">Apartado por 18:42</p>

      <div class="acciones">
        <span class="btn">Continuar</span>
      </div>
    </div>
  </div>
</body>
</html>
