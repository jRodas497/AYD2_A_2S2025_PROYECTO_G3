# Vista parcial para nube: requiere Kafka y los seis proveedores externos provisionados.
# Compose es el entorno completo reproducible; consultar DEPLOY-RENDER.md.
# Blueprint de Render para SGO-Logic (https://docs.render.com/infrastructure-as-code).
#
# Levanta el backend (Spring Boot) y el frontend (React compilado y servido con nginx) con
# Dockerfile.backend y Dockerfile.frontend, en la raíz del repo — Render no resuelve bien
# dockerfilePath/dockerContext cuando la ruta tiene un espacio ("FASE 2"), así que no pueden
# vivir dentro de FASE 2/backend o FASE 2/frontend. Son los mismos Dockerfile que usa
# docker-compose en local (ver FASE 2/docker-compose.yml): una sola fuente, no una copia para
# Render y otra para local.
#
# La base de datos es Neon (https://neon.com), no un recurso de Render: no expira como el
# Postgres gratuito de Render (que caduca a los 30 días) y da una cadena de conexión que ya
# trae usuario y clave, igual que la de Render. Por eso no hay sección "databases" aquí: se crea
# a mano en Neon (pasos en DEPLOY-RENDER.md) y su cadena de conexión se pega como secreto en
# DATABASE_URL (sync: false) la primera vez que se aplica este blueprint.
#
# Diferencias con docker-compose, explicadas en DEPLOY-RENDER.md:
# - Local y CI usan DB_HOST/DB_APP_USER/etc. (dos usuarios: sgologic dueño, sgologic_app de bajo
#   privilegio). Con Neon solo hay un usuario, así que el backend recibe DATABASE_URL completo y
#   lo traduce a spring.datasource.* él mismo (DatabaseUrlEnvironmentPostProcessor), porque el
#   driver de PostgreSQL JDBC no acepta usuario y clave dentro de la URL. Cuál de las dos formas
#   se usa depende solo de si DATABASE_URL está definida o no — ningún otro interruptor.
# - El frontend ya no habla con "backend:8080" (ese nombre solo existe en la red de
#   docker-compose): BACKEND_URL es la URL pública del backend, que se pega como secreto en el
#   dashboard de Render (sync: false).
# - Las migraciones de FASE 2/db/migrations no se aplican solas (ese mecanismo es específico de
#   la imagen oficial de Postgres en un contenedor propio, no de una base administrada): se
#   corren una sola vez a mano con FASE 2/db/scripts/aplicar-migraciones-nube.sh, contra Neon.

services:
  - type: web
    name: sgologic-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    # Sin deploy automático por commit: solo el job deploy de .github/workflows/ci.yml, que corre
    # después de las pruebas, lanza el deploy (por Deploy Hook). Así no sale a producción nada
    # que no haya pasado el CI.
    autoDeployTrigger: off
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: PAYKLIK_URL
        sync: false
      - key: SAT_URL
        sync: false
      - key: LOGIEXPRESS_URL
        sync: false
      - key: MESSAGING_URL
        sync: false
      - key: POS_URL
        sync: false
      - key: ERP_URL
        sync: false
      - key: CARRIER_WEBHOOK_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Cloudflare R2 (API compatible con S3) para el archivo de intercambio con el ERP: el
      # filesystem de un servicio en Render no persiste entre despliegues, así que el ERP no
      # puede seguir escribiendo a disco como en local (ver ErpFileStorage). Las cuatro son
      # opcionales en conjunto: si no se definen, el backend sigue escribiendo a
      # /app/erp-out dentro del contenedor (se pierde en cada deploy, pero no rompe nada).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  - type: web
    name: sgologic-frontend
    runtime: docker
    dockerfilePath: Dockerfile.frontend
    dockerContext: .
    autoDeployTrigger: off
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "8080"
      # URL pública del backend (https://sgologic-backend.onrender.com o la que Render asigne),
      # pegada a mano en el dashboard. No se usa fromService/hostport porque un servicio gratuito
      # no recibe tráfico por la red privada y el nombre interno no resuelve.
      - key: BACKEND_URL
        sync: false
