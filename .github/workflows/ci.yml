name: CI

# El deploy lo hace Render: sus servicios tienen autoDeployTrigger: checksPass (ver render.yaml),
# así que solo despliegan un commit de develop cuando todos los checks de este workflow pasan.
# Si backend, frontend o e2e fallan, Render no despliega. Por eso este workflow no tiene un job
# de deploy propio: agregarlo (y hacerlo esperar a Render) crearía un círculo, porque Render
# esperaría a que ese job pase y el job esperaría a Render.

# feature/202200389-deploy-render ya se juntó a develop (PR #15): corre en cada push a develop y
# en cada pull request contra develop, que es el gate real para lo que entra al proyecto. Se deja
# también el push directo a la rama de trabajo mientras siga abierta, para ver el resultado antes
# de abrir el PR.
on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "FASE 2/backend/pom.xml"
      - name: mvn test
        working-directory: FASE 2/backend
        run: mvn -B test

  frontend:
    name: Frontend (tsc, Vitest, oxlint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "FASE 2/frontend/package-lock.json"
      - name: npm ci
        working-directory: FASE 2/frontend
        run: npm ci
      - name: Tipos (tsc -b)
        working-directory: FASE 2/frontend
        run: npx tsc -b --noEmit
      - name: Pruebas unitarias (Vitest)
        working-directory: FASE 2/frontend
        run: npx vitest run
      - name: Lint (oxlint)
        working-directory: FASE 2/frontend
        run: npx oxlint
      - name: Build
        working-directory: FASE 2/frontend
        run: npm run build

  e2e:
    name: Fase 3 (integración, carga, estrés, fallas y E2E)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "FASE 2/frontend/package-lock.json"
      - name: Flujo automático y verificación de mínimos por categoría
        run: python "FASE 3/verificar.py"
      - name: Evidencia de pruebas (éxito o fallo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase3-pruebas
          path: |
            FASE 3/resultados/
            FASE 2/frontend/test-results/
          retention-days: 14
          if-no-files-found: error
