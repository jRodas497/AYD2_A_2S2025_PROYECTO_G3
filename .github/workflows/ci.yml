name: CI

# feature/202200389-deploy-render ya se juntó a develop (PR #15): corre en cada push a develop y
# en cada pull request contra develop, que es el gate real para lo que entra al proyecto. Se deja
# también el push directo a la rama de trabajo mientras siga abierta, para ver el resultado antes
# de abrir el PR.
on:
  push:
    branches:
      - develop
      - feature/202200389-deploy-render
  pull_request:
    branches:
      - develop
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "FASE 2/backend/pom.xml"
      - name: mvn test
        working-directory: FASE 2/backend
        run: mvn -B test

  frontend:
    name: Frontend (tsc, Vitest, oxlint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "FASE 2/frontend/package-lock.json"
      - name: npm ci
        working-directory: FASE 2/frontend
        run: npm ci
      - name: Tipos (tsc -b)
        working-directory: FASE 2/frontend
        run: npx tsc -b --noEmit
      - name: Pruebas unitarias (Vitest)
        working-directory: FASE 2/frontend
        run: npx vitest run
      - name: Lint (oxlint)
        working-directory: FASE 2/frontend
        run: npx oxlint
      - name: Build
        working-directory: FASE 2/frontend
        run: npm run build

  e2e:
    name: End-to-end (Docker + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack (docker compose)
        working-directory: FASE 2
        run: docker compose up -d --build

      - name: Esperar a que el backend y el frontend respondan
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/products > /dev/null; then
              echo "arriba"
              exit 0
            fi
            sleep 2
          done
          echo "el stack no respondió a tiempo" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "FASE 2/frontend/package-lock.json"

      - name: npm ci
        working-directory: FASE 2/frontend
        run: npm ci

      - name: Instalar navegadores de Playwright
        working-directory: FASE 2/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: FASE 2/frontend
        run: npx playwright test

      - name: Logs del stack (si algo falló)
        if: failure()
        working-directory: FASE 2
        run: docker compose logs

      - name: Subir el reporte de Playwright (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FASE 2/frontend/playwright-report/
          retention-days: 7

      - name: Apagar el stack
        if: always()
        working-directory: FASE 2
        run: docker compose down -v

  deploy:
    name: Deploy a Render
    # El "no se debe hacer deploy si las pruebas no pasan" lo da needs: si backend, frontend o
    # e2e fallan, GitHub Actions ni siquiera intenta este job.
    needs: [e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reiniciar la base en la nube (si RESET_SEED_CLOUD = true)
        # Mismo interruptor que RESET_SEED en iniciar.sh, pero sobre Neon de verdad en vez de un
        # contenedor local: en true, BORRA todos los esquemas de la base y los recrea desde las
        # migraciones antes de que el nuevo backend arranque. "vars" (no "secrets") porque
        # true/false no es sensible y sí se puede leer directo en "if". Requiere el secreto
        # DATABASE_URL del repositorio (Settings > Secrets and variables > Actions) — es una
        # copia aparte de la que ya está pegada en el dashboard de Render, GitHub Actions no
        # puede leer esa. Se salta solo si no existe.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        if: ${{ vars.RESET_SEED_CLOUD == 'true' && env.DATABASE_URL != '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          "FASE 2/db/scripts/reiniciar-base-nube.sh" "$DATABASE_URL"

      - name: Disparar deploy del backend en Render
        # El "deploy hook" de cada servicio se crea en Render (Settings > Deploy Hook) y se
        # guarda como secreto del repositorio. Mientras no exista, este paso se salta en vez de
        # fallar el pipeline — así el gate de pruebas funciona aunque el deploy aún no esté
        # configurado. "secrets" no se puede usar directo en "if" (GitHub Actions lo rechaza, ver
        # contextos disponibles para "if"), por eso pasa primero por una variable de entorno.
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Disparar deploy del frontend en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
